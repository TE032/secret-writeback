name: Update_GitHub_Secret_DEV

on:
  workflow_dispatch:
    inputs:
      secret_value:
        description: 'The value to write to the secret'
        required: true
        type: string

jobs:
  update_secret:
    name: Update Test Secret
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    
    steps:
      - name: Update GitHub Secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_VALUE: ${{ inputs.secret_value }}
        run: |
          # Install GitHub CLI if not available
          if ! command -v gh &> /dev/null; then
            apt-get update && apt-get install -y curl
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update && apt-get install -y gh
          fi
          
          # Update the secret in the dev environment
          if gh secret set "TEST_SECRET" \
            --env dev \
            --body "$SECRET_VALUE" \
            --repo ${{ github.repository }}; then
            echo "✅ Secret 'TEST_SECRET' has been successfully updated in the dev environment"
          else
            echo "❌ Failed to update secret 'TEST_SECRET'"
            exit 1
          fi
          
          # List secrets to verify it exists (won't show value, just confirms existence)
          echo ""
          echo "📋 Listing secrets in dev environment:"
          gh secret list --env dev --repo ${{ github.repository }}

